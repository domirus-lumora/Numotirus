name: Discord Notify

on:
  push:
    branches: [ main, SKILL ]
  issues:
    types: [ opened, closed ]
  issue_comment:
    types: [ created ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Push
        if: github.event_name == 'push'
        uses: tsickert/discord-webhook@v5.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            📦 **New commit on `${{ github.ref_name }}`**
            `${{ github.event.head_commit.message }}`
            [${{ github.repository }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

      - name: Issue
        if: github.event_name == 'issues'
        uses: tsickert/discord-webhook@v5.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            🐛 **Issue ${{ github.event.action }}**
            **${{ github.event.issue.title }}**
            ${{ github.event.issue.html_url }}

      - name: Issue Comment
        if: github.event_name == 'issue_comment'
        uses: tsickert/discord-webhook@v5.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            💬 **New comment on issue #${{ github.event.issue.number }}**
            ${{ github.event.comment.user.login }}: ${{ github.event.comment.body }}
            ${{ github.event.comment.html_url }}