# GitHub Actions workflow for code quality checks.
# GitHub Actions 代码质量检查工作流。

name: Code Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  quality:
    name: Check Code Quality. 检查代码质量。
    runs-on: ubuntu-latest

    steps:

      # Checkout repository. 检出仓库。
      - name: Checkout code. 检出代码。
        uses: actions/checkout@v4


      # Install required tools. 安装所需工具。
      - name: Install dependencies. 安装依赖。
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy python3-pip
          python3 -m pip install --user pre-commit


      # Generate compilation database.
      # 生成编译数据库。
      - name: Generate compile_commands.json. 生成编译数据库。
        run: |
          python3 .github/CodeCheck/scripts/generate_compile_commands.py


      # Run the complete CodeCheck configuration.
      # 运行完整的 CodeCheck 配置。
      - name: Run CodeCheck. 运行 CodeCheck。
        run: |
          pre-commit run \
            --config .github/CodeCheck/.pre-commit-config.yaml \
            --all-files
