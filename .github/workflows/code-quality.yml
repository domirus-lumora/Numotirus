# GitHub Actions workflow for code quality checks. GitHub Actions 代码质量检查工作流。
name: Code Quality Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality:
    name: Check C/C++ Code Quality. 检查 C/C++ 代码质量。
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code. 检出代码。
        uses: actions/checkout@v4

      - name: Install dependencies. 安装依赖。
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cppcheck python3-pip
          pip3 install pre-commit

      - name: Run clang-format. 运行 clang-format。
        run: |
          find . \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            -exec clang-format --style=file:.github/CodeCheck/clang-format --dry-run --Werror {} +

      - name: Run clang-tidy (C++). 运行 clang-tidy（C++）。
        run: |
          find . \( -name "*.cpp" -o -name "*.hpp" \) \
            -exec clang-tidy --config-file=.github/CodeCheck/clang-tidy \
              --checks='readability-*,cppcoreguidelines-*,modernize-*,llvm-include-order' {} -- \;
        continue-on-error: false

      - name: Run cppcheck (C). 运行 cppcheck（C）。
        run: |
          C_FILES=$(find . -name "*.c" | tr '\n' ' ')
          if [ -n "$C_FILES" ]; then
            cppcheck --enable=all --error-exitcode=1 --suppress=missingIncludeSystem $C_FILES
          fi

      - name: Run custom C style checks. 运行自定义 C 代码规范检查。
        run: python3 .github/CodeCheck/scripts/check_c_coding_style.py

      - name: Run custom C++ style checks. 运行自定义 C++ 代码规范检查。
        run: python3 .github/CodeCheck/scripts/check_cpp_coding_style.py

      - name: Run comment style checks. 运行注释规范检查。
        run: python3 .github/CodeCheck/scripts/check_comment_style.py

      - name: Run L10N format checks. 运行 L10N 占位符格式检查。
        run: python3 .github/CodeCheck/scripts/check_l10n.py

      - name: Check for debug code (warning only). 检查调试代码（仅警告）。
        run: |
          if grep -r "printf\|cout\|console\.log\|debugger" \
            --include="*.c" --include="*.cpp" --include="*.h" --include="*.hpp" . 2>/dev/null; then
            echo "⚠️  Warning: Debug code found in the above files. 警告：上述文件中发现调试代码。"
          else
            echo "✅ No debug code found. 未发现调试代码。"
          fi