# Pre-commit hooks configuration. Pre-commit 钩子配置。
# All hooks run on staged files. 所有钩子在暂存文件上运行。

repos:
  # General hooks. 通用钩子。
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        files: \.(c|cpp|h|hpp|py|sh|md)$
        exclude: ^(legacy/|old/|third_party/|deps/|core/p2p/kcp/|core/protocol/noise-cpp/)
      - id: end-of-file-fixer
        files: \.(c|cpp|h|hpp|py|sh|md)$
        exclude: ^(legacy/|old/|third_party/|deps/|core/p2p/kcp/|core/protocol/noise-cpp/)
      - id: check-yaml
        exclude: ^(legacy/|old/|third_party/|deps/|core/p2p/kcp/|core/protocol/noise-cpp/)
      - id: check-added-large-files
        args: ['--maxkb=500']
        exclude: ^(legacy/|old/|third_party/|deps/|core/p2p/kcp/|core/protocol/noise-cpp/)
      - id: detect-private-key
        exclude: ^(legacy/|old/|third_party/|deps/|core/p2p/kcp/|core/protocol/noise-cpp/)
      - id: check-merge-conflict
        exclude: ^(legacy/|old/|third_party/|deps/|core/p2p/kcp/|core/protocol/noise-cpp/)

  # clang-format: auto‑format code. 自动格式化代码。
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.1.11
    hooks:
      - id: clang-format
        args: [--style=file]   # reads .clang-format from repo root. 从仓库根目录读取 .clang-format。
        files: \.(c|cpp|h|hpp|cc|hh)$
        exclude: ^(legacy/|old/|third_party/|deps/|core/p2p/kcp/|core/protocol/noise-cpp/)

  # clang-tidy: static analysis for C++ (only checks, no auto-fix). C++ 静态分析（仅检查，不自动修复）。
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.1.11
    hooks:
      - id: clang-tidy
        args:
          - --config-file=.clang-tidy          # 使用根目录的配置文件
        files: \.(cpp|hpp|cc|hh)$
        exclude: ^(legacy/|old/|third_party/|deps/|core/p2p/kcp/|core/protocol/noise-cpp/)

  # Custom hooks (only for checks not covered by standard tools). 自定义钩子（仅用于标准工具未覆盖的检查）。
  - repo: local
    hooks:
      # Check that public interfaces have comments. 检查公共接口是否有注释。
      - id: check-comment-style
        name: Check comment style. 检查注释规范。
        entry: python3 .github/CodeCheck/scripts/check_comment_style.py
        language: python
        files: \.(c|cpp|h|hpp)$
        exclude: ^(legacy/|old/|third_party/|deps/|core/p2p/kcp/|core/protocol/noise-cpp/)
        pass_filenames: true
        additional_dependencies: []

      # Check L10N_PENDING placeholder format. 检查 L10N_PENDING 占位符格式。
      - id: check-l10n
        name: Check L10N_PENDING format. 检查 L10N_PENDING 占位符格式。
        entry: python3 .github/CodeCheck/scripts/check_l10n.py
        language: python
        files: \.(c|cpp|h|hpp)$
        exclude: ^(legacy/|old/|third_party/|deps/|core/p2p/kcp/|core/protocol/noise-cpp/)
        pass_filenames: true
        additional_dependencies: []

      # Scan third-party dependencies (warning only). 扫描第三方依赖（仅警告）。
      - id: check-dependencies
        name: Scan third-party dependencies. 扫描第三方依赖。
        entry: python3 .github/CodeCheck/scripts/check_dependencies.py
        language: python
        files: \.(c|cpp|h|hpp|cmake|txt|json)$
        pass_filenames: false   # 脚本会自行扫描整个仓库
        additional_dependencies: []